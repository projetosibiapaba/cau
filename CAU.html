<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Risco para Alocação de UTI</title>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            padding: 28px 32px;
            width: 100%;
            max-width: 550px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-top: 0;
            margin-bottom: 24px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 16px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #fafafa;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007AFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-13%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2013l128%20127.9c3.6%203.6%207.8%205.4%2013%205.4s9.4-1.8%2013-5.4L287%2095.2c3.6-3.6%205.4-7.8%205.4-13%200-5-1.8-9.2-5.4-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            background-color: #007aff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #resultContainer {
            margin-top: 24px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            display: none; /* Começa oculto */
        }

        #resultRecommendation {
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 700;
        }
        
        #resultJustification {
            margin: 0;
            font-size: 16px;
        }

        /* Classes de resultado */
        .result-sim {
            background-color: #ffebee;
            border: 1px solid #e57373;
            color: #c62828;
        }
        .result-considerar {
            background-color: #fff8e1;
            border: 1px solid #ffd54f;
            color: #f57f17;
        }
        .result-nao {
            background-color: #e8f5e9;
            border: 1px solid #81c784;
            color: #2e7d32;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Calculadora de Risco para Alocação de UTI</h1>

        <div class="input-group">
            <label for="porte">1. Porte Cirúrgico</label>
            <select id="porte">
                <option value="p1">Porte I (Pequeno)</option>
                <option value="p2">Porte II (Médio)</option>
                <option value="p3">Porte III (Grande)</option>
                <option value="p4">Porte IV (Especial)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="asa">2. Classificação ASA</label>
            <select id="asa">
                <option value="asa1">ASA 1</option>
                <option value="asa2">ASA 2</option>
                <option value="asa3">ASA 3</option>
                <option value="asa4">ASA 4</option>
                <option value="asa5">ASA 5</option>
            </select>
        </div>

        <div class="input-group">
            <label for="lee">3. Índice de Lee (RCRI)</label>
            <select id="lee">
                <option value="lee1">Classe I (0-1 pontos)</option>
                <option value="lee2">Classe II (2 pontos)</option>
                <option value="lee3">Classe III (>= 3 pontos)</option>
            </select>
        </div>

        <button id="calculateBtn">Calcular Recomendação</button>

        <div id="resultContainer">
            <h2 id="resultRecommendation"></h2>
            <p id="resultJustification"></p>
        </div>
    </div>

    <script>
        // --- O "CÉREBRO" DA APLICAÇÃO ---
        // Esta é a Matriz de Decisão (Lookup Table)
        // Estrutura: logic[lee][porte][asa]
        const logicMatrix = {
            "lee1": { // Lee 0-1
                "p1": { "asa1": "Não", "asa2": "Não", "asa3": "Não", "asa4": "Considerar" },
                "p2": { "asa1": "Não", "asa2": "Não", "asa3": "Considerar", "asa4": "Sim" },
                "p3": { "asa1": "Não", "asa2": "Considerar", "asa3": "Sim", "asa4": "Sim" },
                "p4": { "asa1": "Considerar", "asa2": "Sim", "asa3": "Sim", "asa4": "Sim" }
            },
            "lee2": { // Lee 2
                "p1": { "asa1": "Não", "asa2": "Não", "asa3": "Considerar", "asa4": "Sim" },
                "p2": { "asa1": "Não", "asa2": "Considerar", "asa3": "Sim", "asa4": "Sim" },
                "p3": { "asa1": "Considerar", "asa2": "Sim", "asa3": "Sim", "asa4": "Sim" },
                "p4": { "asa1": "Sim", "asa2": "Sim", "asa3": "Sim", "asa4": "Sim" }
            },
            "lee3": { // Lee >= 3
                "p1": { "asa1": "Não", "asa2": "Considerar", "asa3": "Sim", "asa4": "Sim" },
                "p2": { "asa1": "Considerar", "asa2": "Sim", "asa3": "Sim", "asa4": "Sim" },
                "p3": { "asa1": "Sim", "asa2": "Sim", "asa3": "Sim", "asa4": "Sim" },
                "p4": { "asa1": "Sim", "asa2": "Sim", "asa3": "Sim", "asa4": "Sim" }
            }
        };

        // Textos de Justificativa
        const justifications = {
            "Sim": "Risco elevado. Reserva de UTI fortemente recomendada.",
            "Não": "Risco baixo. Encaminhar para SRPA/Leito de enfermaria.",
            "Considerar": "Risco intermediário. Decisão clínica individualizada (discutir com anestesia/cirurgia).",
            "Sim_ASA5": "Paciente moribundo (ASA 5) tem indicação de UTI independentemente do procedimento."
        };

        // Classes de Estilo
        const resultClasses = {
            "Sim": "result-sim",
            "Não": "result-nao",
            "Considerar": "result-considerar",
            "Sim_ASA5": "result-sim"
        };


        // --- O "MOTOR" ---
        
        // 1. Encontrar os elementos da página
        const calculateBtn = document.getElementById("calculateBtn");
        const resultContainer = document.getElementById("resultContainer");
        const resultRecommendation = document.getElementById("resultRecommendation");
        const resultJustification = document.getElementById("resultJustification");

        const porteSelect = document.getElementById("porte");
        const asaSelect = document.getElementById("asa");
        const leeSelect = document.getElementById("lee");

        // 2. Adicionar o "ouvinte" de clique no botão
        calculateBtn.addEventListener("click", function() {
            
            // 3. Obter os valores selecionados
            const porteVal = porteSelect.value;
            const asaVal = asaSelect.value;
            const leeVal = leeSelect.value;

            let recommendation = "";
            let justificationKey = "";

            // 4. A Lógica de Decisão
            
            // Regra de Exceção: ASA 5
            if (asaVal === "asa5") {
                recommendation = "Sim";
                justificationKey = "Sim_ASA5";
            } else {
                // Consulta a matriz
                recommendation = logicMatrix[leeVal][porteVal][asaVal];
                justificationKey = recommendation;
            }

            // 5. Exibir o Resultado
            
            // Define o texto
            resultRecommendation.innerText = recommendation;
            resultJustification.innerText = justifications[justificationKey];

            // Remove classes de estilo antigas e adiciona a nova
            resultContainer.classList.remove("result-sim", "result-nao", "result-considerar");
            resultContainer.classList.add(resultClasses[justificationKey]);

            // Mostra o container de resultado
            resultContainer.style.display = "block";
        });

    </script>
</body>
</html>
